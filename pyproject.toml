[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-watcher"
version = "0.2.0"
description = "Read-only RuneScape screen observability and notification tool"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "flake8>=7",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
screen-watcher = "screen_watcher.cli:main"

[tool.setuptools]
packages = ["screen_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q screen_watcher watcher.py

      - name: Validate profiles
        run: screen-watcher validate-profiles

      - name: Test
        run: python -m pytest --cov=screen_watcher --cov-report=term-missing

      - name: Lint
        run: flake8 screen_watcher watcher.py tests --ignore=E226,E501,W503,W504

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy screen_watcher --ignore-missing-imports

      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
